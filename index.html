<!-- =====================================================
     PREMIUM LOADING — GANTI BAGIAN LOADING LAMA DENGAN INI
===================================================== -->

<div id="page-loader">

    <div class="loader-content">

        <div class="loader-logo">
            XI
        </div>

        <div class="loader-title">
            XI IPS 1
        </div>

        <div class="loader-subtitle">
            CLASS PORTAL
        </div>

        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>

        <div class="loader-status" id="loaderStatus">
            Memuat website...
        </div>

    </div>

</div>

<style>

/* ===============================
   PREMIUM LOADING
================================ */

#page-loader{
    position:fixed;
    inset:0;
    z-index:999999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(140,255,152,.13),
            transparent 32%
        ),
        #050609;

    opacity:1;
    visibility:visible;

    transition:
        opacity .65s ease,
        visibility .65s ease;

    overflow:hidden;
}


/* GLOW */

#page-loader::before{
    content:"";

    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    background:rgba(140,255,152,.07);

    filter:blur(80px);

    animation:
        loaderGlow 3s ease-in-out infinite;
}


/* CONTENT */

.loader-content{
    position:relative;
    z-index:2;

    width:min(380px,85%);

    text-align:center;

    animation:
        loaderEnter .7s cubic-bezier(.2,.8,.2,1);
}


/* LOGO */

.loader-logo{
    width:76px;
    height:76px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(140,255,152,.35);

    border-radius:22px;

    background:rgba(255,255,255,.045);

    backdrop-filter:blur(20px);

    color:#8cff98;

    font-size:25px;
    font-weight:800;

    letter-spacing:2px;

    box-shadow:
        0 0 25px rgba(140,255,152,.12),
        inset 0 0 25px rgba(140,255,152,.03);

    animation:
        logoFloat 2.4s ease-in-out infinite,
        logoPulse 2s ease-in-out infinite;
}


/* TITLE */

.loader-title{
    color:#f7f9f8;

    font-size:27px;

    font-weight:800;

    letter-spacing:-.5px;
}


/* SUBTITLE */

.loader-subtitle{
    margin-top:5px;

    color:#98a19b;

    font-size:12px;

    letter-spacing:3px;

    text-transform:uppercase;
}


/* PROGRESS BAR */

.loader-bar{
    position:relative;

    width:100%;

    height:5px;

    margin-top:30px;

    overflow:hidden;

    border-radius:20px;

    background:rgba(255,255,255,.08);
}


/* PROGRESS */

.loader-progress{
    width:0%;

    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #8cff98,
            #c5ffca,
            #8cff98
        );

    box-shadow:
        0 0 15px rgba(140,255,152,.7);

    animation:
        loadingProgress 1.8s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


/* STATUS */

.loader-status{
    margin-top:14px;

    color:#98a19b;

    font-size:12px;

    transition:
        opacity .25s ease;
}


/* HIDE */

#page-loader.loaded{
    opacity:0;

    visibility:hidden;

    pointer-events:none;
}


/* ANIMATIONS */

@keyframes loaderEnter{

    from{
        opacity:0;
        transform:
            translateY(20px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}


@keyframes logoFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }

}


@keyframes logoPulse{

    0%,100%{
        box-shadow:
            0 0 25px rgba(140,255,152,.12),
            inset 0 0 25px rgba(140,255,152,.03);
    }

    50%{
        box-shadow:
            0 0 45px rgba(140,255,152,.25),
            inset 0 0 30px rgba(140,255,152,.06);
    }

}


@keyframes loaderGlow{

    0%,100%{
        transform:scale(.9);
        opacity:.5;
    }

    50%{
        transform:scale(1.15);
        opacity:.8;
    }

}


@keyframes loadingProgress{

    0%{
        width:0%;
    }

    35%{
        width:38%;
    }

    70%{
        width:76%;
    }

    100%{
        width:100%;
    }

}


/* MOBILE */

@media(max-width:600px){

    .loader-logo{
        width:68px;
        height:68px;
        font-size:23px;
    }

    .loader-title{
        font-size:24px;
    }

    .loader-subtitle{
        font-size:10px;
    }

}


/* REDUCED MOTION */

@media(prefers-reduced-motion:reduce){

    #page-loader,
    .loader-content,
    .loader-logo,
    .loader-progress{
        animation:none;
    }

}

</style>

<script>

(function(){

    const loader =
        document.getElementById("page-loader");

    const status =
        document.getElementById("loaderStatus");

    if(!loader || !status) return;


    const messages = [

        "Memuat website...",
        "Menyiapkan halaman...",
        "Memuat komponen...",
        "Menyiapkan Class Portal...",
        "Hampir selesai..."

    ];


    let index = 0;


    const messageTimer = setInterval(function(){

        index++;

        if(index >= messages.length){

            clearInterval(messageTimer);

            return;

        }


        status.style.opacity = "0";


        setTimeout(function(){

            status.textContent =
                messages[index];

            status.style.opacity = "1";

        },120);


    },400);


    function hideLoader(){

        clearInterval(messageTimer);

        status.textContent =
            "Selamat datang!";


        setTimeout(function(){

            loader.classList.add("loaded");

        },300);

    }


    if(document.readyState === "complete"){

        setTimeout(
            hideLoader,
            700
        );

    }else{

        window.addEventListener(
            "load",
            function(){

                setTimeout(
                    hideLoader,
                    700
                );

            },
            {once:true}
        );

    }

})();

</script>
