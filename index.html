<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XI IPS 1 — Spotify</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%,rgba(30,215,96,.15),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(80,50,180,.15),transparent 30%),
        #080b0a;
    color:white;
}

.container{
    width:min(1100px,92%);
    margin:auto;
}

header{
    padding:22px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:900;
}

.logo span{
    color:#1ed760;
}

.nav a{
    color:#aaa;
    text-decoration:none;
    margin-left:20px;
}

.nav a:hover{
    color:#1ed760;
}

main{
    padding:70px 0;
}

.hero{
    text-align:center;
    margin-bottom:50px;
}

.hero small{
    color:#1ed760;
    letter-spacing:3px;
    font-weight:bold;
}

.hero h1{
    font-size:clamp(40px,7vw,80px);
    margin:15px 0;
}

.hero h1 span{
    color:#1ed760;
}

.hero p{
    color:#999;
}

.spotify-login-box{
    max-width:650px;
    margin:auto;
    padding:50px 30px;
    text-align:center;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.1);
    border-radius:28px;

    backdrop-filter:blur(25px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.4);
}

.spotify-logo{
    width:80px;
    height:80px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#1ed760;

    color:#000;

    font-size:40px;
    font-weight:900;

    box-shadow:
        0 0 45px rgba(30,215,96,.4);
}

.spotify-login-box h2{
    font-size:32px;
    margin:22px 0 10px;
}

.spotify-login-box p{
    color:#999;
}

.spotify-login-btn{
    margin-top:25px;

    padding:15px 28px;

    border:0;
    border-radius:30px;

    background:#1ed760;
    color:#000;

    font-weight:800;
    font-size:15px;

    cursor:pointer;

    transition:.25s;
}

.spotify-login-btn:hover{
    transform:translateY(-3px);

    box-shadow:
        0 10px 35px rgba(30,215,96,.35);
}

.spotify-message{
    margin-top:15px;
    min-height:20px;
}

.spotify-profile{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:22px;

    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.08);

    border-radius:22px;

    backdrop-filter:blur(20px);
}

.profile-left{
    display:flex;
    align-items:center;
    gap:16px;
}

.spotify-avatar{
    width:65px;
    height:65px;

    border-radius:50%;

    object-fit:cover;

    background:#222;
}

.spotify-label{
    display:block;

    font-size:10px;

    letter-spacing:2px;

    color:#1ed760;

    font-weight:800;
}

.spotify-profile h2{
    margin:5px 0;
}

.spotify-profile p{
    color:#999;
}

.spotify-logout{
    padding:10px 18px;

    border:1px solid rgba(255,255,255,.1);

    border-radius:12px;

    background:rgba(255,255,255,.05);

    color:white;

    cursor:pointer;
}

.spotify-content{
    margin-top:35px;
}

.playlist-heading{
    margin-bottom:20px;
}

.playlist-heading h2{
    margin:7px 0;
    font-size:30px;
}

.playlist-heading p{
    color:#888;
}

.spotify-playlist{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(230px,1fr));

    gap:18px;
}

.spotify-playlist-card{
    position:relative;

    padding:15px;

    background:rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.08);

    border-radius:20px;

    cursor:pointer;

    transition:.25s;
}

.spotify-playlist-card:hover{
    transform:translateY(-6px);

    border-color:rgba(30,215,96,.4);

    background:rgba(30,215,96,.08);
}

.playlist-cover{
    width:100%;

    aspect-ratio:1;

    overflow:hidden;

    border-radius:15px;

    margin-bottom:15px;

    background:
        linear-gradient(
            135deg,
            #1ed760,
            #111
        );
}

.playlist-cover img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.playlist-cover-placeholder{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:45px;

    color:#1ed760;
}

.spotify-playlist-card h3{
    font-size:16px;
    margin-bottom:6px;
}

.spotify-playlist-card p{
    color:#888;
    font-size:13px;
}

.local-badge{
    position:absolute;

    top:12px;
    left:12px;

    padding:5px 9px;

    border-radius:8px;

    background:#1ed760;
    color:#000;

    font-size:9px;
    font-weight:900;

    z-index:2;
}

footer{
    text-align:center;

    padding:30px;

    color:#666;

    border-top:1px solid rgba(255,255,255,.06);
}

@media(max-width:600px){

    .nav{
        flex-direction:column;
        gap:15px;
    }

    .nav a{
        margin:0 7px;
        font-size:13px;
    }

    .spotify-profile{
        flex-direction:column;
        align-items:flex-start;
        gap:20px;
    }

    .spotify-logout{
        width:100%;
    }

    .spotify-playlist{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header>

<div class="container nav">

<div class="logo">
XI <span>IPS 1</span>
</div>

<nav>
<a href="#home">Home</a>
<a href="#spotify">Spotify</a>
</nav>

</div>

</header>


<main id="home">

<div class="container">

<section class="hero">

<small>XI IPS 1 • MUSIC</small>

<h1>
Music
<span>Connected.</span>
</h1>

<p>
Hubungkan akun Spotify untuk melihat profil dan playlist.
</p>

</section>


<section id="spotify">


<!-- LOGIN -->

<div
id="spotifyLoginBox"
class="spotify-login-box"
>

<div class="spotify-logo">
S
</div>

<h2>Spotify</h2>

<p>
Hubungkan akun Spotify kamu
untuk melihat playlist.
</p>

<button
id="spotifyLogin"
class="spotify-login-btn"
type="button"
>
Login dengan Spotify
</button>

<p
id="spotifyMessage"
class="spotify-message"
></p>

</div>


<!-- PROFILE -->

<div
id="spotifyProfile"
class="spotify-profile"
style="display:none;"
>

<div class="profile-left">

<img
id="spotifyUserImage"
class="spotify-avatar"
src=""
alt="Profile Spotify"
/>

<div>

<span class="spotify-label">
SPOTIFY ACCOUNT
</span>

<h2 id="spotifyUserName">
Spotify User
</h2>

<p id="spotifyUserEmail">
-
</p>

</div>

</div>

<button
id="spotifyLogout"
class="spotify-logout"
type="button"
>
Logout
</button>

</div>


<!-- PLAYLIST -->

<div
id="spotifyContent"
class="spotify-content"
style="display:none;"
>

<div class="playlist-heading">

<span class="spotify-label">
MUSIC
</span>

<h2>
Playlist Spotify
</h2>

<p id="playlistCount">
Memuat playlist...
</p>

</div>

<div
id="spotifyPlaylist"
class="spotify-playlist"
></div>

</div>


</section>

</div>

</main>


<footer>

XI IPS 1
<br>
Created by Aldiansyah

</footer>


<script>

"use strict";


/* =====================================
   SPOTIFY CONFIG
===================================== */

const CLIENT_ID =
"a5dd486ff00a4694b004bb9b3d583591";

const REDIRECT_URI =
"https://aldi-web969.github.io/XI-IPS-1/";

const SCOPES = [
"user-read-private",
"user-read-email",
"playlist-read-private",
"playlist-read-collaborative"
].join(" ");


const STORAGE = {

state:
"xi_spotify_state",

verifier:
"xi_spotify_verifier",

accessToken:
"xi_spotify_access_token",

expires:
"xi_spotify_expires"

};


/* =====================================
   LOCAL SONG
===================================== */

const LOCAL_PLAYLIST = [

{
name:"Lagu XI IPS 1",
artist:"XI IPS 1",
file:"assets/audio/lagu1.mp3"
},

{
name:"Lagu Favorit XI IPS 1",
artist:"XI IPS 1",
file:"assets/audio/lagu2.mp3"
}

];


/* =====================================
   RANDOM STRING
===================================== */

function randomString(length){

const chars =
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

const array =
new Uint8Array(length);

crypto.getRandomValues(array);

return Array.from(array)
.map(x => chars[x % chars.length])
.join("");

}


/* =====================================
   PKCE
===================================== */

async function createChallenge(verifier){

const data =
new TextEncoder()
.encode(verifier);

const hash =
await crypto.subtle.digest(
"SHA-256",
data
);

const bytes =
new Uint8Array(hash);

let binary = "";

bytes.forEach(
byte =>
binary += String.fromCharCode(byte)
);

return btoa(binary)
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}


/* =====================================
   LOGIN
===================================== */

async function loginSpotify(){

try{

const verifier =
randomString(96);

const state =
randomString(32);

const challenge =
await createChallenge(verifier);


localStorage.setItem(
STORAGE.verifier,
verifier
);

localStorage.setItem(
STORAGE.state,
state
);


const params =
new URLSearchParams({

client_id:CLIENT_ID,

response_type:"code",

redirect_uri:REDIRECT_URI,

scope:SCOPES,

state:state,

code_challenge_method:"S256",

code_challenge:challenge

});


window.location.href =
"https://accounts.spotify.com/authorize?"
+
params.toString();

}catch(error){

console.error(error);

showMessage(
"Login Spotify gagal dimulai."
);

}

}


/* =====================================
   CALLBACK
===================================== */

async function handleCallback(){

const params =
new URLSearchParams(
window.location.search
);

const code =
params.get("code");

const state =
params.get("state");

const error =
params.get("error");


if(!code && !error)
return false;


if(error){

clearOAuth();

cleanURL();

showMessage(
"Login Spotify dibatalkan."
);

return true;

}


const savedState =
localStorage.getItem(
STORAGE.state
);


if(
!savedState ||
!state ||
savedState !== state
){

console.error(
"STATE MISMATCH"
);

clearOAuth();

cleanURL();

showMessage(
"Login gagal: state tidak cocok."
);

return true;

}


const verifier =
localStorage.getItem(
STORAGE.verifier
);


if(!verifier){

showMessage(
"Code verifier tidak ditemukan."
);

return true;

}


try{

const token =
await exchangeToken(
code,
verifier
);


saveToken(token);

clearOAuth();

cleanURL();

await loadAccount();

return true;

}catch(error){

console.error(error);

clearOAuth();

cleanURL();

showMessage(
"Login Spotify gagal."
);

return true;

}

}


/* =====================================
   TOKEN
===================================== */

async function exchangeToken(
code,
verifier
){

const body =
new URLSearchParams({

client_id:CLIENT_ID,

grant_type:"authorization_code",

code:code,

redirect_uri:REDIRECT_URI,

code_verifier:verifier

});


const response =
await fetch(
"https://accounts.spotify.com/api/token",
{

method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body:body

}
);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error_description ||
"Token gagal."
);

}


return data;

}


function saveToken(token){

localStorage.setItem(
STORAGE.accessToken,
token.access_token
);

localStorage.setItem(
STORAGE.expires,

Date.now() +
(
(token.expires_in || 3600)
* 1000
)

);

}


function getToken(){

const token =
localStorage.getItem(
STORAGE.accessToken
);

const expires =
Number(
localStorage.getItem(
STORAGE.expires
)
);


if(!token)
return null;


if(
expires &&
Date.now() >= expires
){

localStorage.removeItem(
STORAGE.accessToken
);

localStorage.removeItem(
STORAGE.expires
);

return null;

}


return token;

}


/* =====================================
   SPOTIFY API
===================================== */

async function api(
endpoint,
token
){

const response =
await fetch(
"https://api.spotify.com/v1"
+
endpoint,
{

headers:{
Authorization:
`Bearer ${token}`
}

}
);


if(!response.ok){

throw new Error(
"Spotify API error"
);

}


return response.json();

}


/* =====================================
   ACCOUNT
===================================== */

async function loadAccount(){

const token =
getToken();


if(!token){

showLogin();

return;

}


try{

const profile =
await api(
"/me",
token
);

showProfile(profile);


const playlists =
await getPlaylists(token);


renderPlaylists(
playlists
);


}catch(error){

console.error(error);

logoutSpotify();

}

}


/* =====================================
   PLAYLIST
===================================== */

async function getPlaylists(token){

let playlists = [];

let url =
"/me/playlists?limit=50";


while(url){

const response =
await api(
url,
token
);


if(response.items){

playlists.push(
...response.items
);

}


if(response.next){

const next =
new URL(response.next);

url =
next.pathname +
next.search;

}else{

url = null;

}

}


return playlists;

}


/* =====================================
   RENDER
===================================== */

function renderPlaylists(
playlists
){

const container =
document.getElementById(
"spotifyPlaylist"
);


container.innerHTML = "";


LOCAL_PLAYLIST.forEach(
song => {

container.appendChild(
createLocalSong(song)
);

}
);


playlists.forEach(
playlist => {

container.appendChild(
createSpotifyPlaylist(
playlist
)
);

}
);


const count =
document.getElementById(
"playlistCount"
);


count.textContent =
`${playlists.length} playlist Spotify + 2 lagu lokal`;

}


/* =====================================
   LOCAL SONG
===================================== */

function createLocalSong(song){

const card =
document.createElement("div");

card.className =
"spotify-playlist-card";


card.innerHTML = `

<div class="local-badge">
LOCAL
</div>

<div class="playlist-cover">

<div class="playlist-cover-placeholder">
♪
</div>

</div>

<h3>
${escapeHTML(song.name)}
</h3>

<p>
${escapeHTML(song.artist)}
</p>

`;


card.onclick =
() => playLocalSong(song);


return card;

}


/* =====================================
   SPOTIFY PLAYLIST
===================================== */

function createSpotifyPlaylist(
playlist
){

const card =
document.createElement("div");

card.className =
"spotify-playlist-card";


const image =
playlist.images?.[0]?.url;


card.innerHTML = `

<div class="playlist-cover">

${
image

?

`<img
src="${escapeHTML(image)}"
alt=""
>`

:

`

<div class="playlist-cover-placeholder">
♫
</div>

`
}

</div>

<h3>
${escapeHTML(playlist.name)}
</h3>

<p>
${playlist.tracks?.total || 0}
lagu
</p>

`;


card.onclick = () => {

if(
playlist.external_urls?.spotify
){

window.open(
playlist.external_urls.spotify,
"_blank"
);

}

};


return card;

}


/* =====================================
   PROFILE
===================================== */

function showProfile(profile){

document.getElementById(
"spotifyLoginBox"
).style.display =
"none";


document.getElementById(
"spotifyProfile"
).style.display =
"flex";


document.getElementById(
"spotifyContent"
).style.display =
"block";


document.getElementById(
"spotifyUserName"
).textContent =
profile.display_name ||
"Spotify User";


document.getElementById(
"spotifyUserEmail"
).textContent =
profile.email ||
"Akun Spotify";


if(profile.images?.length){

document.getElementById(
"spotifyUserImage"
).src =
profile.images[0].url;

}

}


/* =====================================
   SHOW LOGIN
===================================== */

function showLogin(){

document.getElementById(
"spotifyLoginBox"
).style.display =
"block";


document.getElementById(
"spotifyProfile"
).style.display =
"none";


document.getElementById(
"spotifyContent"
).style.display =
"none";

}


/* =====================================
   LOGOUT
===================================== */

function logoutSpotify(){

localStorage.removeItem(
STORAGE.accessToken
);

localStorage.removeItem(
STORAGE.expires
);

clearOAuth();

showLogin();

document.getElementById(
"spotifyPlaylist"
).innerHTML = "";

showMessage(
"Logout berhasil."
);

}


/* =====================================
   UTILITY
===================================== */

function clearOAuth(){

localStorage.removeItem(
STORAGE.state
);

localStorage.removeItem(
STORAGE.verifier
);

}


function cleanURL(){

window.history.replaceState(
{},
document.title,
window.location.origin +
window.location.pathname
);

}


function showMessage(message){

const element =
document.getElementById(
"spotifyMessage"
);

element.textContent =
message;

}


function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================
   INIT
===================================== */

async function init(){

document.getElementById(
"spotifyLogin"
).addEventListener(
"click",
loginSpotify
);


document.getElementById(
"spotifyLogout"
).addEventListener(
"click",
logoutSpotify
);


const callback =
await handleCallback();


if(callback)
return;


if(getToken()){

await loadAccount();

}else{

showLogin();

}

}


document.addEventListener(
"DOMContentLoaded",
init
);

</script>

</body>
</html>
