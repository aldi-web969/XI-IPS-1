<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XI IPS 1 Music</title>

    <link rel="stylesheet" href="css/music.css">
</head>

<body>

    <!-- TOMBOL BUKA MUSIC -->
    <button id="openMusic" class="open-music">
        ♪
    </button>


    <!-- MUSIC PLAYER -->
    <section id="musicUI" class="music-ui">

        <!-- HEADER -->
        <header class="music-header">

            <div class="brand">

                <div class="brand-icon">
                    ♪
                </div>

                <div>
                    <h1>XI IPS 1</h1>
                    <p>Music Player</p>
                </div>

            </div>

            <button id="closeMusic" class="close-btn">
                ×
            </button>

        </header>


        <!-- SEARCH -->
        <div class="search-box">

            <span>⌕</span>

            <input
                id="searchInput"
                type="search"
                placeholder="Cari lagu..."
                autocomplete="off"
            >

        </div>


        <!-- CONTENT -->
        <main class="music-content">

            <!-- NOW PLAYING -->
            <section class="now-playing">

                <div id="cover" class="cover">
                    <div class="cover-icon">
                        ♪
                    </div>
                </div>

                <div class="song-info">

                    <span class="now-label">
                        NOW PLAYING
                    </span>

                    <h2 id="songTitle">
                        Belum ada lagu
                    </h2>

                    <p id="songArtist">
                        XI IPS 1
                    </p>

                </div>

                <button
                    id="favoriteBtn"
                    class="favorite"
                >
                    ♡
                </button>

            </section>


            <!-- PLAYLIST -->
            <section class="playlist-section">

                <div class="section-title">

                    <div>
                        <h2>Playlist</h2>

                        <p id="songCount">
                            10 lagu
                        </p>
                    </div>

                </div>

                <div
                    id="playlist"
                    class="playlist"
                ></div>

            </section>

        </main>


        <!-- PLAYER -->
        <footer class="player">

            <div class="player-top">

                <span id="currentTime">
                    0:00
                </span>

                <input
                    id="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duration">
                    0:00
                </span>

            </div>


            <div class="player-controls">

                <button id="previousBtn">
                    ⏮
                </button>

                <button
                    id="playBtn"
                    class="play-btn"
                >
                    ▶
                </button>

                <button id="nextBtn">
                    ⏭
                </button>

                <div class="volume">

                    <span>🔊</span>

                    <input
                        id="volume"
                        type="range"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.8"
                    >

                </div>

            </div>

        </footer>

    </section>


    <!-- AUDIO -->
    <audio
        id="audio"
        preload="metadata"
    ></audio>


    <script src="js/music.js"></script>

</body>
</html>
