<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Kelompok - XI IPS 1</title>
    <link href="assets/images/logo.svg" rel="icon" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="grid"></div>
    </div>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <div class="logo-icon">XI</div>
            <div>
                <strong>XI IPS 1</strong>
                <small>Class Portal</small>
            </div>
        </div>

        <nav>
            <a href="index.html#home">Home</a>
            <a href="index.html#students">Siswa</a>
            <a href="index.html#schedule">Jadwal</a>
            <a href="index.html#moments">Class Moments</a>
            <a href="index.html#spotify">Music</a>
            <a href="group.html" class="active">Spin Kelompok</a>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <section class="section" style="margin-top: 40px;">
            <div class="section-heading">
                <div>
                    <span class="section-label">RANDOMIZER</span>
                    <h2>Spin / Acak Kelompok</h2>
                    <p>Bagi siswa XI IPS 1 menjadi beberapa kelompok secara adil dan acak.</p>
                </div>
            </div>

            <!-- CONTROLS -->
            <div class="group-controls" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 24px; border-radius: 16px; margin-bottom: 30px; display: flex; gap: 20px; flex-wrap: wrap; align-items: center;">
                <div style="flex: 1; min-width: 200px;">
                    <label for="groupCount" style="display: block; margin-bottom: 8px; font-size: 14px; color: #aaa;">Jumlah Kelompok:</label>
                    <input type="number" id="groupCount" min="2" max="10" value="5" style="width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #fff; font-size: 16px;">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button id="generateBtn" class="btn primary" style="padding: 12px 24px; cursor: pointer;">Acak Sekarang</button>
                </div>
            </div>

            <!-- RESULT CONTAINER -->
            <div id="groupResult" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                <!-- Hasil acak kelompok akan muncul di sini secara dinamis -->
                <div style="text-align: center; grid-column: 1 / -1; padding: 40px; color: #777;">
                    Klik tombol "Acak Sekarang" untuk mulai membagikan kelompok.
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <div>
            <strong>XI IPS 1</strong>
            <p>Class Portal</p>
        </div>
        <div>
            Dibuat oleh <strong>Aldiansyah</strong>
        </div>
    </footer>

    <!-- SCRIPT PENGACAK KELOMPOK -->
    <script>
        // Daftar nama siswa XI IPS 1 (Dapat disesuaikan jika ada perubahan)
        const studentsData = [
            "Ahmad", "Aldiansyah", "Andini", "Aurel", "Bintang", 
            "Cinta", "Dimas", "Farel", "Fira", "Gilang", 
            "Hana", "Iqbal", "Keisha", "M. Fajri", "Nabila", 
            "Nazwa", "Rafli", "Raka", "Ratu", "Rehan", 
            "Rizki", "Salsabila", "Tegar", "Vina", "Wahyudi", 
            "Zahra", "Zidan"
        ];

        document.getElementById('generateBtn').addEventListener('click', () => {
            const groupCountInput = parseInt(document.getElementById('groupCount').value);
            const resultContainer = document.getElementById('groupResult');

            if (isNaN(groupCountInput) || groupCountInput < 2) {
                alert("Masukkan jumlah kelompok minimal 2!");
                return;
            }

            // Salin dan acak array siswa (Fisher-Yates Shuffle)
            let shuffled = [...studentsData].sort(() => Math.random() - 0.5);
            
            let groups = Array.from({ length: groupCountInput }, () => []);

            // Distribusikan siswa ke masing-masing kelompok
            shuffled.forEach((student, index) => {
                groups[index % groupCountInput].push(student);
            });

            // Render hasil ke HTML
            resultContainer.innerHTML = '';
            groups.forEach((group, idx) => {
                let card = document.createElement('div');
                card.style.cssText = "background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 20px; border-radius: 14px;";
                
                let membersList = group.map((m, i) => `<li style="margin-bottom: 6px; color: #ccc;">${i + 1}. ${m}</li>`).join('');
                
                card.innerHTML = `
                    <h3 style="margin-bottom: 12px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">Kelompok ${idx + 1} <span style="font-size: 12px; color: #888; font-weight: normal;">(${group.length} Orang)</span></h3>
                    <ul style="padding-left: 20px; margin: 0;">
                        ${membersList}
                    </ul>
                `;
                resultContainer.appendChild(card);
            });
        });
    </script>
</body>

</html>
